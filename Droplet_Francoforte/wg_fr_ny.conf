[Interface]
Address = 10.200.1.1/32
PrivateKey = PrivateKey_Francoforte_for_NewYork
ListenPort = 51821

PostUp = ufw route allow in on wg_h_fr out on wg_ny
PostUp = ufw route allow in on wg_ny out on wg_h_fr
PostUp = iptables -t nat -A POSTROUTING -o wg_ny -j MASQUERADE

#Per non perdere accesso ala droplet, imposto routing personalizzato utilizzando le tabelle create precedentemente in rt_tables (fr e ny)
PostUp = ip rule add table fr from 68.183.214.127 priority 100
PostUp = ip route add table fr default via 68.183.208.1

PostUp = ip rule add from 10.200.0.1 lookup ny priority 150|| true
PostUp = ip route add default dev wg_ny table ny || true

#Rimozione in PreDown
PreDown = ip rule delete table fr from 68.183.214.127 priority 100 || true
PreDown = ip route delete table fr default via 68.183.208.1 || true

#Riabilito l'inoltro sull'interfaccia pubblica per il single-tunnel
PreDown = ufw route delete allow in on wg_h_fr out on wg_ny || true
PreDown = ufw route delete allow in on wg_ny out on wg_h_fr || true
PreDown = ufw route allow in on wg_h_fr out on eth0

#Disabilito il mascheramento sull'interfaccia di NewYork e riabilito il mascheramento sull'interfaccia pubblica
PreDown = iptables -t nat -D POSTROUTING -o wg_ny -j MASQUERADE || true
PreDown = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

PreDown = ip rule del from 10.200.0.1 lookup ny priority 150 || true

[Peer]
PublicKey = PublicKey_Francoforte_for_NewYork
Endpoint  = 137.184.156.248:51821
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
