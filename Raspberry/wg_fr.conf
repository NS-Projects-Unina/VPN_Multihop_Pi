[Interface]
Address = 10.200.0.1/32
PrivateKey = PrivateKey_RaspberryPi_to_Francoforte
ListenPort = 51820

#Disabilito route automatiche di wg-quick per gestire le rotte a mano, altrimenti vengo tagliato fuori dal Raspberry a causa del marking automatico
Table = off

#Marking per full tunnel su wgA, escludendo LAN e wgB
PostUp = iptables -t mangle -A OUTPUT -d 192.168.3.0/24 -j RETURN
PostUp = iptables -t mangle -A OUTPUT -s 10.50.0.0/24 -j RETURN
PostUp = iptables -t mangle -A OUTPUT -p udp --sport 51825 -j RETURN
PostUp = iptables -t mangle -A OUTPUT -d 68.183.214.127 -j RETURN

#Marco tutto il resto con 0xca6c
PostUp = iptables -t mangle -A OUTPUT -j MARK --set-mark 0xca6c

#Creo la tabella 51820 per i pacchetti marcati
PostUp = ip route add default dev wgA table 51820
PostUp = ip rule add fwmark 0xca6c table 51820 priority 200

PostUp = iptables -t nat -A POSTROUTING -o wgA -j MASQUERADE

#Rimozione in PreDown
PreDown = iptables -t nat -D POSTROUTING -o wgA -j MASQUERADE || true

PreDown = iptables -t mangle -D OUTPUT -d 192.168.3.0/24 -j RETURN || true
PreDown = iptables -t mangle -D OUTPUT -s 10.50.0.0/24 -j RETURN || true
PreDown = iptables -t mangle -D OUTPUT -p udp --sport 51825 -j RETURN || true
PreDown = iptables -t mangle -D OUTPUT -j MARK --set-mark 0xca6c || true

PreDown = ip route del default dev wgA table 51820 || true
PreDown = ip rule del fwmark 0xca6c table 51820 priority 200 || true

[Peer]
PublicKey = PublicKey_Server_Francoforte
Endpoint = 68.183.214.127:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
